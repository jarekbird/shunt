# Claude apps gateway config for the local reference probe.
# Throwaway dev fixture — jwt_secret / client_secret / api_key are
# deliberately fake dummy values, never used outside 127.0.0.1.
#
# Template rendered into the private run directory by driver.py.
# http:// public_url was accepted on loopback in gateway 2.1.211 (July 2026).

listen:
  host: 127.0.0.1
  port: @@GATEWAY_PORT@@
  public_url: http://127.0.0.1:@@GATEWAY_PORT@@

oidc:
  issuer: http://127.0.0.1:@@DEX_PORT@@/dex
  client_id: claude-gateway
  client_secret: gateway-secret

session:
  jwt_secret: @@JWT_SECRET@@
  ttl_hours: 1

store:
  postgres_url: postgres://postgres:@@PG_PASSWORD@@@127.0.0.1:@@PG_PORT@@/postgres

upstreams:
  - provider: anthropic
    auth:
      api_key: sk-ant-dummy-probe-key

managed:
  policies:
    - match: {}
      cli:
        availableModels: [claude-opus-4-8, claude-sonnet-4-6, claude-haiku-4-5]
        env:
          DISABLE_UPDATES: "1"

# Pointing at the driver's local sink so the
# OTLP relay path can be observed. Configuring forward_to is also what
# makes /managed/settings push the OTEL_* env block to clients.
telemetry:
  forward_to:
    - url: http://127.0.0.1:@@SINK_PORT@@
